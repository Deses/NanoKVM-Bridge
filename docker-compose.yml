services:
  nanokvm-bridge:
    build:
      context: .
      args:
        NANOKVM_USB_VERSION: "1.1.4"
        WITH_AUDIO: "false"
    image: ghcr.io/deses/nanokvm-bridge:latest
    container_name: nanokvm-bridge
    restart: unless-stopped

    ports:
      - "47812:80"

    volumes:
      - /dev:/dev
      - nanokvm_data:/data

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 166:* rmw"
      - "c 188:* rmw"
      # - "c 116:* rmw"

    environment:
      VIDEO_RESOLUTION: "1920x1080"
      VIDEO_FPS: "30"
      AUDIO: "off"
      # AUTH_USER: admin
      # AUTH_PASSWORD: change-me

    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nanokvm_data:
