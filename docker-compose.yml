services:
  nanokvm-bridge:
    build:
      context: .
      args:
        NANOKVM_USB_VERSION: "1.1.4"
        WITH_AUDIO: "false"
    image: ghcr.io/deses/nanokvm-bridge:${IMAGE_TAG:-latest}
    container_name: nanokvm-bridge
    restart: unless-stopped

    ports:
      - "47812:80"

    volumes:
      - /dev:/dev
      - nanokvm_data:/data

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 166:* rmw"
      - "c 188:* rmw"
      # - "c 116:* rmw"

    environment:
      VIDEO_RESOLUTION: "1920x1080"
      VIDEO_FPS: "30"
      AUDIO: "off"
      # AUTH_USER: admin
      # AUTH_PASSWORD: change-me
      # Target keyboard layout for the phone keyboard: en-US (default) or es-ES.
      # Codes are language-COUNTRY: https://en.wikipedia.org/wiki/IETF_language_tag
      # KEYBOARD_LAYOUT: "en-US"

volumes:
  nanokvm_data:
